```html
<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vilket typsnitt är du?</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main class="fortune-machine">


    <!-- =====================================
         FLOATING LOGO
    ====================================== -->

    <header class="machine-header">

        <div class="floating-logo">

            <!--
                BYT UT DETTA MOT DIN LOGGA

                Exempel:

                <img
                    src="assets/logo.svg"
                    alt="Vilket typsnitt är du?"
                >
            -->

            <div class="logo-placeholder">
                DIN LOGGA
            </div>

        </div>

    </header>



    <!-- =====================================
         START SCREEN
    ====================================== -->

    <section
        id="start-screen"
        class="screen active"
    >

        <div class="intro">

            <h1 class="intro-title">
                Vilket typsnitt<br>
                är du?
            </h1>


            <button
                id="start-button"
                class="start-button"
            >
                STARTA LÄSNINGEN
            </button>

        </div>

    </section>



    <!-- =====================================
         QUIZ SCREEN
    ====================================== -->

    <section
        id="quiz-screen"
        class="screen"
    >

        <div class="quiz">


            <!-- PROGRESS -->

            <div class="progress">

                <span id="question-number">
                    01
                </span>

                <span class="progress-line"></span>

                <span>
                    10
                </span>

            </div>



            <!-- QUESTION -->

            <h2 id="question-text">
                Frågan kommer här
            </h2>



            <!-- ANSWERS -->

            <div
                id="answers"
                class="answers"
            >


                <!-- RED -->

                <button
                    class="answer-option"
                    data-answer="A"
                >

                    <span class="orb orb-red"></span>

                    <span class="answer-text"></span>

                </button>



                <!-- BLUE -->

                <button
                    class="answer-option"
                    data-answer="B"
                >

                    <span class="orb orb-blue"></span>

                    <span class="answer-text"></span>

                </button>



                <!-- GOLD -->

                <button
                    class="answer-option"
                    data-answer="C"
                >

                    <span class="orb orb-gold"></span>

                    <span class="answer-text"></span>

                </button>



                <!-- GREEN -->

                <button
                    class="answer-option"
                    data-answer="D"
                >

                    <span class="orb orb-green"></span>

                    <span class="answer-text"></span>

                </button>


            </div>



            <!-- READING STATUS -->

            <div
                id="answer-label"
                class="answer-label"
            >
                Välj ett tecken
            </div>


        </div>

    </section>



    <!-- =====================================
         RESULT SCREEN
    ====================================== -->

    <section
        id="result-screen"
        class="screen"
    >

        <div class="result">


            <p class="result-intro">
                TECKNEN HAR TALAT
            </p>


            <p class="result-label">
                Ditt typsnitt är
            </p>


            <h2
                id="result-font"
            >
                Futura
            </h2>


            <p
                id="result-description"
                class="result-description"
            >
                Geometric, clean and progressive
            </p>


            <button
                id="restart-button"
                class="restart-button"
            >
                GÖR EN NY LÄSNING
            </button>


        </div>

    </section>


</main>


<script src="script.js"></script>

</body>

</html>
```
