<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vilket typsnitt är du?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="fortune-machine">

    <!-- =====================================
         HEADER / LOGO
    ====================================== -->

    <header class="machine-header">

        <div class="floating-logo">

            <!--
                LÄGG DIN LOGO HÄR

                Exempel:

                <img src="assets/logo.svg" alt="Logo">

            -->

           <img
    src="logga.png"
    alt="Logga"
    class="logo-image"
>

        </div>

    </header>


    <!-- =====================================
         START
    ====================================== -->

    <section id="start-screen" class="screen active">

        <div class="intro">

            <h1 class="intro-title">
                Vilket typsnitt<br>
                är du?
            </h1>

            <button id="start-button" class="start-button">
                STARTA LÄSNINGEN
            </button>

        </div>

    </section>


    <!-- =====================================
         QUIZ
    ====================================== -->

    <section id="quiz-screen" class="screen">

        <div class="quiz">

            <div class="progress">

                <span id="question-number">01</span>

                <span class="progress-line"></span>

                <span>10</span>

            </div>


            <h2 id="question-text">
                Frågan kommer här
            </h2>


            <div id="answers" class="answers">

                <button
                    class="orb orb-red"
                    data-answer="A"
                    aria-label="Svar A">
                </button>

                <button
                    class="orb orb-blue"
                    data-answer="B"
                    aria-label="Svar B">
                </button>

                <button
                    class="orb orb-gold"
                    data-answer="C"
                    aria-label="Svar C">
                </button>

                <button
                    class="orb orb-green"
                    data-answer="D"
                    aria-label="Svar D">
                </button>

            </div>


            <div id="answer-label" class="answer-label">
                Välj ett tecken
            </div>

        </div>

    </section>


    <!-- =====================================
         RESULT
    ====================================== -->

    <section id="result-screen" class="screen">

        <div class="result">

            <p class="result-intro">
                TECKNEN HAR TALAT
            </p>

            <p class="result-label">
                Ditt typsnitt är
            </p>

            <h2 id="result-font">
                Futura
            </h2>

            <p id="result-description" class="result-description">
                Geometric, clean and progressive
            </p>

            <button id="restart-button" class="restart-button">
                GÖR EN NY LÄSNING
            </button>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
